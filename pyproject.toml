[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clr-akvorado-mcp"
version = "2.0.0"
description = "A read-only MCP server for Akvorado network flow analysis via the Console API"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "clearminds"}]
keywords = ["mcp", "akvorado", "netflow", "network", "sflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastmcp>=4.2,<5",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Repository = "https://github.com/clearminds/clr-akvorado-mcp"

[project.scripts]
clr-akvorado-mcp = "clr_akvorado_mcp.server:main"
